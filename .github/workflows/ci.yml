name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # expo-env.d.ts is gitignored (Expo's own generated-file convention —
      # see its own "should be in your gitignore" comment) and only exists
      # locally because running any `expo` command creates it. Its one line
      # is what pulls in expo/types' ambient `declare module '*.module.css'`
      # (among other ambient types) via a triple-slash reference — without
      # it, tsc has no idea what a `.module.css` import is. A fresh CI
      # checkout never had this file, so every CSS Modules import (e.g.
      # animated-icon.web.tsx) failed here even though local typechecks
      # were clean. Content matches exactly what `expo start`/`expo
      # customize expo-env.d.ts` generates.
      - name: Generate expo-env.d.ts
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - name: TypeScript check
        run: npx tsc --noEmit

  build-android:
    name: EAS Build — Android Preview
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: EAS Build (Android preview)
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  build-ios:
    name: EAS Build — iOS Preview
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: EAS Build (iOS preview)
        run: eas build --platform ios --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
